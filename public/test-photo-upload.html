<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Photo Upload - Enhanced Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .camera-container {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            background: #f8f9fa;
            margin-bottom: 1rem;
        }
        
        .camera-preview {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
        }
        
        .camera-canvas {
            width: 100%;
            height: 300px;
            border-radius: 6px;
            background: #000;
        }
        
        .camera-preview-container {
            width: 100%;
            height: 300px;
            border-radius: 6px;
            overflow: hidden;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .camera-preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
        
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-camera mr-2"></i>Test Photo Upload - Enhanced Debug</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle mr-2"></i>
                            <strong>Petunjuk:</strong> Test upload foto dari kamera ke server dengan debugging yang lebih detail.
                        </div>
                        
                        <form id="testForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="mesin_id">Mesin ID</label>
                                        <input type="number" class="form-control" id="mesin_id" name="mesin_id" value="1" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="user_id">User ID</label>
                                        <input type="number" class="form-control" id="user_id" name="user_id" value="1" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="part_id">Part ID</label>
                                        <input type="number" class="form-control" id="part_id" name="part_id" value="1" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="shift">Shift</label>
                                        <select class="form-control" id="shift" name="shift" required>
                                            <option value="pagi">Pagi</option>
                                            <option value="siang">Siang</option>
                                            <option value="malam">Malam</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Camera Section -->
                            <div class="camera-container">
                                <label class="font-weight-bold">Test Photo</label>
                                <video id="camera-test" class="camera-preview" autoplay playsinline style="display: none;"></video>
                                <canvas id="canvas-test" class="camera-canvas" style="display: none;"></canvas>
                                <div id="preview-test" class="camera-preview-container" style="display: none;">
                                    <img id="test_preview" src="" alt="Preview" class="img-fluid rounded">
                                </div>
                                <div class="mt-2">
                                    <button type="button" class="btn btn-primary btn-sm camera-btn">
                                        <i class="fas fa-camera mr-1"></i>Buka Kamera
                                    </button>
                                    <button type="button" class="btn btn-success btn-sm capture-btn" style="display: none;">
                                        <i class="fas fa-camera-retro mr-1"></i>Ambil Foto
                                    </button>
                                    <button type="button" class="btn btn-warning btn-sm retake-btn" style="display: none;">
                                        <i class="fas fa-redo mr-1"></i>Ambil Ulang
                                    </button>
                                </div>
                                <input type="file" id="foto_test" name="foto_apd" style="display: none;" accept="image/*">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-upload mr-1"></i>Test Upload
                            </button>
                        </form>
                        
                        <div class="mt-3">
                            <h6>Debug Info:</h6>
                            <div id="debug-info" class="debug-info">
                                <small>No data yet...</small>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <h6>Form Data Preview:</h6>
                            <div id="form-data-preview" class="debug-info">
                                <small>No form data yet...</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            let stream = null;
            
            // Camera functionality
            $('.camera-btn').on('click', function() {
                openCamera();
            });
            
            $('.capture-btn').on('click', function() {
                capturePhoto();
            });
            
            $('.retake-btn').on('click', function() {
                retakePhoto();
            });
            
            function openCamera() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: 'environment',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        } 
                    })
                    .then(function(mediaStream) {
                        stream = mediaStream;
                        $('#camera-test')[0].srcObject = mediaStream;
                        $('#camera-test').show();
                        
                        $('.camera-btn').hide();
                        $('.capture-btn').show();
                        $('.retake-btn').hide();
                        $('#preview-test').hide();
                        
                        updateDebugInfo('Camera opened successfully');
                    })
                    .catch(function(error) {
                        console.error('Error accessing camera:', error);
                        updateDebugInfo('Camera error: ' + error.message);
                        Swal.fire({
                            icon: 'error',
                            title: 'Camera Error',
                            text: 'Cannot access camera: ' + error.message
                        });
                    });
                } else {
                    updateDebugInfo('Camera not supported');
                    Swal.fire({
                        icon: 'error',
                        title: 'Not Supported',
                        text: 'Camera not supported in this browser'
                    });
                }
            }
            
            function capturePhoto() {
                const video = $('#camera-test')[0];
                const canvas = $('#canvas-test')[0];
                const context = canvas.getContext('2d');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(function(blob) {
                    const timestamp = Date.now();
                    const filename = `test_photo_${timestamp}.jpg`;
                    const file = new File([blob], filename, { type: 'image/jpeg' });
                    
                    const objectUrl = URL.createObjectURL(blob);
                    
                    $('#test_preview').attr('src', objectUrl);
                    $('#preview-test').show();
                    $('#camera-test').hide();
                    
                    $('.camera-btn').hide();
                    $('.capture-btn').hide();
                    $('.retake-btn').show();
                    
                    // Store file in file input
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    $('#foto_test')[0].files = dataTransfer.files;
                    
                    updateDebugInfo(`Photo captured: ${filename} (${file.size} bytes)`);
                    updateFormDataPreview();
                    
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                        stream = null;
                    }
                }, 'image/jpeg', 0.8);
            }
            
            function retakePhoto() {
                $('#preview-test').hide();
                $('#test_preview').attr('src', '');
                $('#foto_test').val('');
                $('#foto_test')[0].files = new DataTransfer().files;
                
                $('.camera-btn').show();
                $('.capture-btn').hide();
                $('.retake-btn').hide();
                
                updateDebugInfo('Retaking photo...');
                updateFormDataPreview();
                openCamera();
            }
            
            function updateDebugInfo(message) {
                const timestamp = new Date().toLocaleTimeString();
                const currentInfo = $('#debug-info').html();
                const newInfo = `<small>[${timestamp}] ${message}</small><br>`;
                $('#debug-info').html(newInfo + currentInfo);
            }
            
            function updateFormDataPreview() {
                const formData = new FormData($('#testForm')[0]);
                let preview = '<small>Form Data:</small><br>';
                
                for (let [key, value] of formData.entries()) {
                    if (value instanceof File) {
                        preview += `<small>${key}: File - ${value.name} (${value.size} bytes, ${value.type})</small><br>`;
                    } else {
                        preview += `<small>${key}: ${value}</small><br>`;
                    }
                }
                
                $('#form-data-preview').html(preview);
            }
            
            // Form submission
            $('#testForm').on('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(this);
                
                // Log form data
                console.log('Form data:');
                for (let [key, value] of formData.entries()) {
                    if (value instanceof File) {
                        console.log(key + ': File -', {
                            name: value.name,
                            size: value.size,
                            type: value.type
                        });
                    } else {
                        console.log(key + ': ' + value);
                    }
                }
                
                updateDebugInfo('Submitting form...');
                
                // Show loading
                Swal.fire({
                    title: 'Uploading...',
                    text: 'Please wait',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                // Submit to test endpoint
                $.ajax({
                    url: '/super-admin/dashboard/inject/checksheet',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {
                        'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
                    },
                    success: function(response) {
                        console.log('Success:', response);
                        updateDebugInfo('Upload successful: ' + response.message);
                        updateDebugInfo('Photos saved: ' + response.data.total_photos_in_db);
                        Swal.fire({
                            icon: 'success',
                            title: 'Success!',
                            text: response.message + '\nPhotos in DB: ' + response.data.total_photos_in_db
                        });
                    },
                    error: function(xhr, status, error) {
                        console.error('Error:', xhr.responseText);
                        updateDebugInfo('Upload failed: ' + error);
                        updateDebugInfo('Response: ' + xhr.responseText);
                        Swal.fire({
                            icon: 'error',
                            title: 'Upload Failed',
                            text: 'Error: ' + error
                        });
                    }
                });
            });
            
            // Update form data preview on form changes
            $('#testForm input, #testForm select').on('change', function() {
                updateFormDataPreview();
            });
        });
    </script>
</body>
</html>
